name: Update Docker Hub description

on:
  push:
    branches:
      - "1.2.2"
    paths:
      - ".github/workflows/dockerhub-description.yml"

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Update full_description via Docker Hub API
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          cat > /tmp/full_description.md <<'DESCRIPTION_EOF'
          # nicheLLM Proxy

          nicheLLM Proxy relays HTTP requests and responses between an OpenAI-compatible client and an upstream LLM provider. All modes support one listener in a trusted network and opt-in structured protocol logging.

          ## Modes

          | Mode | Upstream | Function |
          |---|---|---|
          | `passthrough` | OpenAI-compatible | Forwards requests without transformation. |
          | `grok-image` | Grok (xAI) | Presents Grok image generation through an OpenAI-compatible interface (v1.1). |
          | `gemini-image` | Google Gemini | Presents Gemini image generation through an OpenAI-compatible interface (v1.2). |

          ## Get the image

          Published multi-platform (`linux/amd64`, `linux/arm64`) images are available at `xhighhongo41/nichellm-proxy`. Use an exact version tag in production; rolling tags such as `1.2` and `latest` also exist.

          ```bash
          docker pull xhighhongo41/nichellm-proxy:1.2.2
          ```

          The image contains no API key or configuration JSON. See the [GitHub repository](https://github.com/xhighhongo41/nicheLLMProxy) for configuration, usage, and the full documentation in English and Japanese.
          DESCRIPTION_EOF
          jwt=$(curl -sS -f -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}')" \
            | jq -r .token)
          unset DOCKERHUB_TOKEN
          test -n "$jwt"
          jq -n --rawfile d /tmp/full_description.md '{full_description: $d}' > /tmp/payload.json
          curl -sS -f -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/nichellm-proxy/" \
            -H "Authorization: JWT ${jwt}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            | jq '{full_description_length: (.full_description | length)}'
          rm -f /tmp/payload.json /tmp/full_description.md