[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "niche-llm-proxy"
version = "0.1.0"
description = "OpenAI互換API向けの拡張可能なLLMプロキシ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
niche-llm-proxy = "niche_llm_proxy.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
