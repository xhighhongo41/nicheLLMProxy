[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "niche-llm-proxy"
version = "0.2.0"
description = "An extensible LLM proxy for OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
niche-llm-proxy = "niche_llm_proxy.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/niche_llm_proxy"]
artifacts = ["src/niche_llm_proxy/locales/**/*.mo"]
