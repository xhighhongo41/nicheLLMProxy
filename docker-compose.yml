services:
  nichellm-proxy:
    build:
      context: .
    ports:
      - "127.0.0.1:${NICHELLM_PORT:-8000}:${NICHELLM_PORT:-8000}"
    environment:
      NICHELLM_CONFIG_PATH: /app/config/config.json
      NICHELLM_LANGUAGE: ${NICHELLM_LANGUAGE:-en}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?UPSTREAM_API_KEY must be set}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./config.json:/app/config/config.json:ro
      - nichellm-proxy-logs:/var/log/nichellm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          port=json.load(open('/app/config/config.json'))['listener']['port'];
          urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  nichellm-proxy-logs:
