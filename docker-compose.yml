services:
  nichellm-proxy:
    build:
      context: .
    ports:
      # Publish one entry per listener port defined in config.jsonc.
      # Add extra mappings (e.g. "127.0.0.1:8001:8001") for multi-listener setups.
      - "127.0.0.1:8000:8000"
    environment:
      NICHELLM_CONFIG_PATH: /app/config/config.jsonc
      NICHELLM_LANGUAGE: ${NICHELLM_LANGUAGE:-en}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?UPSTREAM_API_KEY must be set}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./config.jsonc:/app/config/config.jsonc:ro
      - nichellm-proxy-logs:/var/log/nichellm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          from niche_llm_proxy.config import load_config;
          [urllib.request.urlopen(f'http://127.0.0.1:{l.listener.port}/health', timeout=2).read() for l in load_config().listeners]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  nichellm-proxy-logs:
